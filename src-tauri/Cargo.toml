[package]
name = "financewizard"
version = "0.2.0"
description = "A local personal finance manager"
authors = ["Josse Sendra"]
edition = "2024"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "financewizard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled-sqlcipher-vendored-openssl"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
thiserror = "2"
argon2 = "0.5"
chacha20poly1305 = "0.10"
getrandom = "0.3"
hex = "0.4"
tauri-plugin-updater = "2"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }
zeroize = "1"

# Unoptimised Argon2 takes many seconds per PIN check.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
